name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Set the base path for GitHub Pages project sites (repo subpath).
          # If you deploy to <user>.github.io (user/org site), leave this as "/".
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Locate build output
        id: out
        run: |
          for dir in dist/client dist/public dist .output/public; do
            if [ -d "$dir" ]; then echo "dir=$dir" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "::error::Could not find build output directory" && exit 1

      - name: SPA fallback (404.html)
        run: cp "${{ steps.out.outputs.dir }}/index.html" "${{ steps.out.outputs.dir }}/404.html" || true

      - name: Disable Jekyll
        run: touch "${{ steps.out.outputs.dir }}/.nojekyll"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

      - id: deploy
        uses: actions/deploy-pages@v4
